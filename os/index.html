/* -------------------------------------------------------------- BRIEF
   No model runs in this OS. This app assembles everything the console knows
   into one prompt you paste into Claude yourself — your model, your thinking
   budget, your account, no key and no per-question cost.
   -------------------------------------------------------------------- */
const ASKS={
  read:"Give me your read. Is this a stand-aside or a trade? Make the strongest case on each side, "+
       "commit to one, and name the single thing that would flip you. Be specific about levels.",
  next:"Brief me on the next scheduled catalyst: what the market is positioned for, how NQ typically "+
       "behaves in the thirty minutes either side of it, and how I should be positioned going in.",
  levels:"Map the rest of this session: the level that confirms upside continuation, the level that "+
         "confirms downside, and the zone where there is simply no trade.",
  against:"Argue against the console's bias as hard as you can. Which factor is most likely wrong right "+
          "now, and what would the tape look like if it were?",
  risk:"Critique my risk plan — the stop distance, the size, and where the first target sits relative to "+
       "the structure. What am I not accounting for?",
  none:""
};
const briefCfg={ask:"read",custom:"",wire:12,cal:true,play:true,jrnl:true,method:false};

function buildPrompt(){
  const s=state.signal, q=market.q, L=market.levels, c=state.cfg, P=[], nq=q.nq.last;
  const push=(...x)=>P.push(...x);
  const dist=v=>sgn(nq-v,0);

  push("# NQ futures \u2014 desk brief",
       "_"+s.t.key+" "+pad(s.t.h)+":"+pad(s.t.mi)+" ET \u00b7 generated by NQ Trading OS_","");

  push("You are a futures desk analyst talking to one trader about Nasdaq-100 futures ("+s.contract+").",
       "Everything below is the complete state of my console. Do not invent headlines, prices or levels "+
       "beyond what is given here \u2014 if something you need is missing, say that instead of filling it in.",
       "Plain sentences, trader vocabulary, no preamble and no disclaimers. Take a position.","");

  push("**Data provenance.** "+(market.live
    ? "Quotes and session levels are a real snapshot pulled "+(market.stamp||"recently")+
      ", and the headlines are a real RSS pull."
    : "The tape and levels are SIMULATED \u2014 a random walk anchored to a reference price \u2014 and the "+
      "headlines are sample archetypes, not live news. Treat the numbers as a worked example rather than a "+
      "real market, and say so if I ask you to act on them."),"");

  push("## Clock",
       "- Time: "+pad(s.t.h)+":"+pad(s.t.mi)+" ET",
       "- Session: "+s.sess.name+" \u2014 "+s.sess.note,
       "- Front month: "+s.contract+" ($20 per point, 0.25 tick = $5)","");

  push("## What the console reads",
       "- Composite bias: **"+(s.composite>0?"+":"")+s.composite+"** on a \u2212100..+100 scale",
       "- Confidence: **"+s.conf+"%**",
       "- Verdict: **"+s.label+"**",
       "- Blocking gates: "+(s.gates.length?s.gates.map(g=>g.t+" ("+g.d+")").join("; "):"none"),"");

  push("## Factors","| factor | weight | score | what it is reading |","|---|---|---|---|");
  for(const f of s.factors)
    push("| "+f.name+" | "+Math.round(f.w*100)+"% | "+(f.score>0?"+":"")+f.score+" | "+f.note+" |");
  push("");

  push("## Tape");
  for(const k of ["nq","es","rty","vx","tnx","dxy","gc","cl","btc"]){
    const x=q[k]; if(!x) continue;
    push("- "+x.n+" "+fmt(x.last,x.d)+"  ("+sgn(x.chg)+", "+sgn(x.pct)+"%)"+(x.inv?"  [inverse to NQ]":""));
  }
  push("- NQ\u2013ES spread: "+sgn(q.nq.pct-q.es.pct)+"% ("+(q.nq.pct>=q.es.pct?"NQ leading":"NQ lagging")+")","");

  push("## Levels (distance from spot "+fmt(nq,2)+")");
  for(const [n,v] of [["Prior day high",L.pdh],["Overnight high",L.onh],["Initial balance high",L.ibh],
                      ["Session VWAP",L.vwap],["Prior day close",L.pdc],["Initial balance low",L.ibl],
                      ["Overnight low",L.onl],["Prior day low",L.pdl]])
    push("- "+n+": "+fmt(v,2)+"  ("+dist(v)+" pts)");
  push("");

  if(briefCfg.wire>0){
    const rows=state.wire.slice(0,briefCfg.wire);
    push("## Wire \u2014 newest first, scored \u2212100..+100 by the console's own keyword lexicon.",
         "A score of **0 means no pattern matched**, not that the story is neutral \u2014 judge those "+
         "headlines yourself, and tell me if the lexicon is missing something it should be catching.");
    if(!rows.length) push("_nothing on the wire_");
    for(const w of rows){
      const mins=Math.round((Date.now()-w.ts)/60000);
      push("- **["+(w.score>0?"+":"")+w.score+"]** "+w.txt+
           "  \u2014 "+w.src+", "+(mins<60?mins+"m":Math.floor(mins/60)+"h")+" ago, tier "+(4-w.impact)+
           ", "+(w.channel==="macro"?"rates":"risk")+" channel"+(w.entity?", "+w.entity:"")+(w.demo?" _(sample)_":""));
    }
    push("");
  }

  if(briefCfg.cal){
    push("## Scheduled catalysts");
    let any=false;
    for(const day of calendar(2)) for(const e of day.events){
      if(e.impact<2) continue;
      const m=minsUntil(day.offset,e.min); any=true;
      push("- "+(day.offset?"tomorrow":"today")+" "+hm(e.min)+" ET \u2014 **"+e.name+"** (tier "+(4-e.impact)+
           ", "+(m<0?dur(-m)+" ago":"in "+dur(m))+"): "+e.det);
    }
    if(!any) push("_nothing above tier 3 in the next two days_");
    push("");
  }

  if(briefCfg.play){
    const sp=setups().map(x=>({...x,met:x.c.filter(k=>k.ok).length}));
    const armed=sp.filter(x=>x.met===x.c.length), near=sp.filter(x=>x.met>0&&x.met<x.c.length)
      .sort((a,b)=>(b.met/b.c.length)-(a.met/a.c.length)).slice(0,3);
    push("## Playbook");
    push("Armed (every condition met): "+(armed.length?armed.map(x=>x.n).join(", "):"none"));
    for(const x of near)
      push("- "+x.n+" \u2014 "+x.met+"/"+x.c.length+", missing: "+x.c.filter(k=>!k.ok).map(k=>k.txt).join("; "));
    push("");
  }

  push("## My parameters",
       "- Macro regime: "+(c.regime==="inverse"
          ? "inflation \u2014 good economic news is bad for the index (the rates channel is inverted)"
          : "growth \u2014 good economic news is good for the index"),
       "- Instrument: "+c.instrument+" ($"+(c.instrument==="MNQ"?2:20)+" per point)",
       "- Risk per trade: $"+fmt(c.riskPerTrade,0)+" \u00b7 stop "+c.stopPts+" pts \u00b7 suggested size "+
         (s.size||0)+" contract"+(s.size===1?"":"s"),
       "- I engage above |score| "+c.minScore+" and confidence "+c.minConf+"%","");

  if(briefCfg.jrnl&&state.journal.length){
    const closed=state.journal.filter(r=>r.pts!=null&&r.pts!=="");
    const wins_=closed.filter(r=>+r.pts>0);
    const avg=rs=>rs.length?Math.round(rs.reduce((a,r)=>a+Math.abs(r.score||0),0)/rs.length):null;
    push("## My journal",
         "- "+state.journal.length+" entries, "+closed.length+" closed"+
         (closed.length?", net "+sgn(closed.reduce((a,r)=>a+ +r.pts,0),0)+" pts, "+
          Math.round(wins_.length/closed.length*100)+"% win rate":""));
    const w=avg(wins_), l=avg(closed.filter(r=>+r.pts<=0));
    if(w!=null&&l!=null) push("- Mean |bias score| at entry: "+w+" on winners, "+l+" on losers");
    push("");
  }

  if(briefCfg.method){
    push("## How the console builds its number",
         "Six factors, each scored \u2212100..+100 and weighted: news tape 24%, catalyst posture 16%, rates "+
         "and dollar 18%, risk appetite 18%, session structure 14%, mega-cap torque 10%. The weighted sum is "+
         "the bias score. Confidence is 45% factor agreement, 35% session liquidity, 20% tape freshness. "+
         "Headline sentiment comes from a keyword lexicon split into a rates channel and a risk channel, "+
         "recency-weighted on a 45-minute half-life and scaled by source tier. Gates (closed market, the "+
         "window around a tier-1 print, pre-release compression, lunch chop, low confidence) override "+
         "direction entirely and force a stand-down. Feel free to tell me the weighting is wrong.","");
  }

  const ask=briefCfg.ask==="custom"?briefCfg.custom.trim():ASKS[briefCfg.ask];
  if(ask) push("## What I want from you",ask);
  return P.join("\n");
}

R.brief=function(b){

    if(!done){ ta.focus(); ta.select(); }

};

function applyTheme(){ document.documentElement.setAttribute("data-session",state.cfg.session==="day"?"day":"night"); }

/* =====================================================================
   SHELL CHROME
   ===================================================================== */
const TICK_SYMS=["nq","es","vx","tnx","dxy"];
function paintChrome(){
  const s=state.signal;
  $("#clock").textContent=pad(s.t.h)+":"+pad(s.t.mi)+":"+pad(s.t.s)+" ET";
  $("#sessionpill").textContent=s.sess.name;
  const lamp=$("#syslamp");
  lamp.className="dot"+(s.gates.length?(s.sess.id==="closed"||s.sess.id==="halt"?" bad":" warn"):"");
  lamp.title=s.gates.length?s.gates[0].t:"No blocking condition";
  const fp=$("#feedpill");
  fp.textContent=market.live?"LIVE":"DEMO";
  fp.title=market.live?"Snapshot loaded "+(market.stamp||""):"Simulated tape and sample headlines — open Settings for detail";
  let h="";
  for(const k of TICK_SYMS){
    const q=market.q[k], good=q.inv?-q.pct:q.pct;
    h+='<span class="tk"><i>'+(k==="nq"?s.contract:q.n)+'</i><b>'+fmt(q.last,q.d)+'</b>'+
       '<span class="'+cls(good)+'">'+sgn(q.pct)+'%</span></span>';
  }
  h+='<span class="tk"><i>BIAS</i><b class="'+cls(s.composite)+'">'+(s.composite>0?"+":"")+s.composite+
     '</b><span style="color:var(--ink-3)">'+s.conf+'%</span></span>';
  $("#ticker").innerHTML=h;
  paintTitle();
}
function renderLive(){
  const LIVE=["signal","cat","tape","play","wire"];
  for(const id of LIVE){
    const w=wins[id]; if(!w) continue;
    if(!visible(w)){ w.dirty=true; continue; }
    if(w.node.contains(document.activeElement)) continue;
    renderApp(id);
  }
}

/* =====================================================================
   LIVE SNAPSHOT  — written by the repo fetcher, read on boot or pushed
   at runtime via window.NQOS.loadSnapshot(obj)
   ===================================================================== */
function loadSnapshot(snap){
  if(!snap||typeof snap!=="object") return false;
  if(snap.quotes){
    for(const k in snap.quotes){
      const q=market.q[k]; if(!q) continue;
      const v=snap.quotes[k];
      q.open=v.open!=null?v.open:(v.last-(v.chg||0));
      q.last=v.last!=null?v.last:q.last;
      q.chg=q.last-q.open; q.pct=q.open?q.chg/q.open*100:0;
      q.hi=v.hi!=null?v.hi:Math.max(q.hi,q.last); q.lo=v.lo!=null?v.lo:Math.min(q.lo,q.last);
    }
    market.live=true; market.stamp=snap.stamp||new Date().toLocaleString();
  }
  if(snap.levels){
    /* A live feed that cannot compute a level (no RTH bars yet, so no VWAP and
       no initial balance) must leave it empty rather than fall back to what the
       simulator seeded - a real price measured against an invented VWAP is
       worse than no reading at all. */
    const next={};
    for(const k of ["onh","onl","pdh","pdl","pdc","ibh","ibl","vwap"])
      next[k]=Number.isFinite(snap.levels[k])?snap.levels[k]:null;
    market.levels=next;
  }
  if(Array.isArray(snap.headlines)&&snap.headlines.length){
    state.wire=state.wire.filter(w=>!w.demo);
    ingest(snap.headlines.map(x=>({txt:x.txt||x.title,src:x.src||x.source||"Other",
      ts:x.ts||(x.time?Date.parse(x.time):Date.now())})),false);
  }
  state.signal=computeSignal(); paintChrome(); renderAll(); paintDock();
  return true;
}
window.NQOS={loadSnapshot,state,computeSignal,scoreHeadline,calendar};

/* When the OS is served next to a feed.json (the AWS deploy, or npm run serve
   with a file there), it feeds itself and nothing has to be pasted. */
let selfHosted=false, lastFeedTs=0;
async function pollFeed(){
  try{
    const r=await fetch("feed.json",{cache:"no-store"});
    if(!r.ok) return false;
    const snap=await r.json();
    if(!snap||(!snap.quotes&&!snap.headlines)) return false;
    if(snap.ts!==lastFeedTs){ lastFeedTs=snap.ts; loadSnapshot(snap); }
    selfHosted=true; return true;
  }catch(e){ return false; }
}

/* =====================================================================
   LAYOUT
   ===================================================================== */
function place(id,x,y,w,h){ const n=wins[id]&&wins[id].node; if(!n)return;
  n.style.left=Math.round(x)+"px"; n.style.top=Math.round(y)+"px";
  n.style.width=Math.round(w)+"px"; n.style.height=Math.round(h)+"px"; }
/* Arrange the floating windows. `open` is false when we are re-tiling after
   a return from a touch shell, where the set of open apps is whatever the
   user left behind rather than the default four. */
const TILED=["signal","wire","cat","tape"];
function desktopTile(open){
  const d=$("#desktop"), W=d.clientWidth, H=d.clientHeight, g=10;
  if(W>=1180){
    const c1=Math.min(440,W*.30), c3=Math.min(370,W*.26), c2=W-c1-c3-g*4;
    if(open){ openApp("tape"); openApp("cat"); openApp("wire"); openApp("signal"); }
    place("signal",g,g,c1,H-g*2);
    place("wire",c1+g*2,g,c2,H*.57-g*1.5);
    place("cat",c1+g*2,H*.57+g*.5,c2,H*.43-g*1.5);
    place("tape",c1+c2+g*3,g,c3,H-g*2);
  }else{
    const c1=W*.44, c2=W-c1-g*3;
    if(open){ openApp("cat"); openApp("wire"); openApp("signal"); }
    place("signal",g,g,c1,H-g*2);
    place("wire",c1+g*2,g,c2,H*.56-g*1.5);
    place("cat",c1+g*2,H*.56+g*.5,c2,H*.44-g*1.5);
  }
  /* anything else the user had open cascades out of the corner */
  let i=0;
  for(const a of APPS){
    if(TILED.includes(a.id)||!wins[a.id]) continue;
    place(a.id,30+i*26,24+i*24,Math.min(a.w,W-60),Math.min(a.h,H-60)); i++;
  }
}
function defaultLayout(){
  if(isPhone()){ openApp("cat"); openApp("wire"); openApp("signal"); return; }
  if(isTablet()){ openApp("tape"); openApp("cat"); openApp("wire"); openApp("signal"); return; }
  desktopTile(true);
}

/* Crossing a breakpoint rebuilds the shell around whatever is already open —
   the windows themselves, and their rendered state, are never thrown away. */
function switchMode(next){
  mode=next; applyMode(); closeSheet();
  if(isDesk()){
    dropPanes();
    const desk=$("#desktop");
    for(const k in wins){
      const n=wins[k].node;
      if(n.parentNode!==desk) desk.appendChild(n);
      n.classList.remove("active");
    }
    desktopTile(false);
  }else relayout();
  paintDock(); paintChrome(); renderAll();
}
let vpTimer=null;
function onViewport(){
  const next=deviceMode();
  if(next!==mode) return switchMode(next);
  applyMode();
  if(!isDesk()) return relayout();
  const d=$("#desktop");
  for(const k in wins){ const n=wins[k].node;
    n.style.left=Math.max(0,Math.min(parseFloat(n.style.left)||0,d.clientWidth-70))+"px";
    n.style.top =Math.max(0,Math.min(parseFloat(n.style.top)||0,d.clientHeight-30))+"px"; }
}
/* Mobile browsers fire resize every time the URL bar slides, so debounce. */
const vp=()=>{ clearTimeout(vpTimer); vpTimer=setTimeout(onViewport,120); };
addEventListener("resize",vp);
addEventListener("orientationchange",()=>{ clearTimeout(vpTimer); vpTimer=setTimeout(onViewport,200); });

/* =====================================================================
   BOOT
   ===================================================================== */
const BOOTLOG=[
  "kernel ....................... ok",
  "clock  america/new_york ...... ok",
  "calendar rules  cpi|nfp|pce|fomc",
  "sentiment lexicon  148 patterns",
  "factor model  6 weighted inputs",
  "tape  simulated — no feed attached"
];
async function boot(){
  const log=$("#bootlog"); const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  applyTheme(); seedMarket(state.cfg.ref); ingest(DEMO_WIRE,true);
  state.signal=computeSignal();

  if(!reduce){
    for(let i=0;i<BOOTLOG.length;i++){
      log.innerHTML+=(i?"\n":"")+esc(BOOTLOG[i]).replace(/ok$/,"<b>ok</b>");
      await new Promise(r=>setTimeout(r,105));
    }
    await new Promise(r=>setTimeout(r,170));
  }else log.innerHTML=BOOTLOG.join("\n");

  $("#os").hidden=false;
  paintChrome(); paintDock(); defaultLayout();
  $("#boot").classList.add("done");
  setTimeout(()=>$("#boot").remove(),reduce?0:480);

  /* storage comes up after first paint, never blocking it */
  await store.init();
  const cfg=await store.get("settings");
  if(cfg){ Object.assign(state.cfg,DEFAULTS,cfg); applyTheme();
    if(!market.live) seedMarket(state.cfg.ref); rescoreWire(); }
  const jr=await store.get("journal");
  if(jr&&Array.isArray(jr.rows)) state.journal=jr.rows;
  if(await pollFeed()){
    setInterval(pollFeed,90000);
  }else{
    const feed=await store.get("feed");
    if(feed&&feed.stamp&&(Date.now()-(feed.ts||0)<6*3600e3)) loadSnapshot(feed);
  }
  state.signal=computeSignal(); paintChrome(); renderAll(); paintDock();

  setInterval(()=>{ tickMarket(); state.signal=computeSignal(); paintChrome(); renderLive(); },2000);
  setInterval(paintDock,60000);
}
boot();
})();
