AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NQ Trading OS — a static site on S3 behind CloudFront, with a scheduled
  Lambda that pulls free news and quote feeds into feed.json. Designed to sit
  inside the perpetual AWS free tiers: no load balancer, no NAT gateway, no
  database, no always-on compute.

Parameters:
  ProjectName:
    Type: String
    Default: nq-trading-os
    AllowedPattern: "[a-z0-9-]{3,32}"
    Description: Prefix for every resource name.
  FeedSchedule:
    Type: String
    Default: "cron(0/10 * ? * MON-FRI *)"
    Description: >
      How often to pull the feeds (UTC). The default is every 10 minutes on
      weekdays, which covers Asia, London and the US session — about 3,200 runs
      a month, well inside the Lambda free tier.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch Logs retention. Keep it short — logs are the one thing here that can quietly accrue cost.
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional. Leave empty and the Analyst app stays dark and the stack has no
      LLM cost at all. Provide a key and an analyst endpoint is deployed.
  AnalystModel:
    Type: String
    Default: claude-haiku-4-5
    Description: Model for the analyst endpoint. Haiku is the cheap default; swap for claude-sonnet-5 if you want deeper reads.
  AnalystMaxTokens:
    Type: Number
    Default: 900
    Description: Hard cap on response length — this is the main lever on analyst cost.
  AnalystSharedToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional shared secret the page must send. deploy.sh generates one for you.

Conditions:
  WithAnalyst: !Not [!Equals [!Ref AnthropicApiKey, ""]]

Resources:

  # ---------------------------------------------------------------- site
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}"
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}"
        DefaultRootObject: index.html
        # PriceClass_100 is the cheapest edge footprint (North America + Europe).
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized — honours the Cache-Control we set per object, so
          # feed.json revalidates every 60s while the OS itself caches hard.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------ feed job
  FeedLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-feed"
      RetentionInDays: !Ref LogRetentionDays

  FeedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-feed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SiteBucket.Arn}/feed.json"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${FeedLogGroup.Arn}:*"

  FeedFunction:
    Type: AWS::Lambda::Function
    DependsOn: FeedLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-feed"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FeedRole.Arn
      # 25 network-bound seconds; 512 MB is the sweet spot for parallel fetches.
      Timeout: 90
      MemorySize: 512
      Architectures: [arm64]
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          ANALYST_URL: !If [WithAnalyst, !GetAtt AnalystUrl.FunctionUrl, ""]
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: "placeholder - run deploy.sh" });

  FeedSchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-feed-schedule"
      Description: Pull the news and quote feeds on a schedule.
      ScheduleExpression: !Ref FeedSchedule
      State: ENABLED
      Targets:
        - Id: feed
          Arn: !GetAtt FeedFunction.Arn

  FeedSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FeedFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FeedSchedulerRule.Arn

  # ------------------------------------------------- analyst (optional)
  AnalystLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WithAnalyst
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-analyst"
      RetentionInDays: !Ref LogRetentionDays

  AnalystRole:
    Type: AWS::IAM::Role
    Condition: WithAnalyst
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AnalystLogGroup.Arn}:*"

  AnalystFunction:
    Type: AWS::Lambda::Function
    Condition: WithAnalyst
    DependsOn: AnalystLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-analyst"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AnalystRole.Arn
      Timeout: 60
      MemorySize: 256
      Architectures: [arm64]
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          MODEL: !Ref AnalystModel
          MAX_TOKENS: !Ref AnalystMaxTokens
          SHARED_TOKEN: !Ref AnalystSharedToken
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: "placeholder - run deploy.sh" });

  AnalystUrl:
    Type: AWS::Lambda::Url
    Condition: WithAnalyst
    Properties:
      TargetFunctionArn: !GetAtt AnalystFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 86400

  AnalystUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: WithAnalyst
    Properties:
      FunctionName: !GetAtt AnalystFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  SiteUrl:
    Description: Open this.
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucket:
    Value: !Ref SiteBucket
  FeedFunction:
    Value: !Ref FeedFunction
  DistributionId:
    Value: !Ref Distribution
  AnalystEndpoint:
    Condition: WithAnalyst
    Value: !GetAtt AnalystUrl.FunctionUrl
