AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NQ Trading OS — a static site on S3 behind CloudFront, with a scheduled
  Lambda that pulls free news and quote feeds into feed.json. Designed to sit
  inside the perpetual AWS free tiers: no load balancer, no NAT gateway, no
  database, no always-on compute.

Parameters:
  ProjectName:
    Type: String
    Default: nq-trading-os
    AllowedPattern: "[a-z0-9-]{3,32}"
    Description: Prefix for every resource name.
  FeedSchedule:
    Type: String
    Default: "cron(0/10 * ? * MON-FRI *)"
    Description: >
      How often to pull the feeds (UTC). The default is every 10 minutes on
      weekdays, which covers Asia, London and the US session — about 3,200 runs
      a month, well inside the Lambda free tier.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch Logs retention. Keep it short — logs are the one thing here that can quietly accrue cost.
  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional custom hostname, e.g. nq.example.com. Leave empty to use the
      CloudFront domain. Requires HostedZoneId and CertificateArn.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone holding DomainName. deploy.sh finds it for you.
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate covering DomainName. Must live in us-east-1 — CloudFront
      accepts certificates from no other region. deploy.sh finds it for you.

Conditions:
  WithDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:

  # ---------------------------------------------------------------- site
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}"
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}"
        DefaultRootObject: index.html
        # PriceClass_100 is the cheapest edge footprint (North America + Europe).
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [WithDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - WithDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized — honours the Cache-Control we set per object, so
          # feed.json revalidates every 60s while the OS itself caches hard.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # Z2FDTNDATAQYW2 is CloudFront's own fixed hosted-zone id, the same one every
  # CloudFront alias record uses. It is a global constant, not account-specific.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: WithDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------ feed job
  FeedLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-feed"
      RetentionInDays: !Ref LogRetentionDays

  FeedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-feed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SiteBucket.Arn}/feed.json"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${FeedLogGroup.Arn}:*"

  FeedFunction:
    Type: AWS::Lambda::Function
    DependsOn: FeedLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-feed"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FeedRole.Arn
      # 25 network-bound seconds; 512 MB is the sweet spot for parallel fetches.
      Timeout: 90
      MemorySize: 512
      Architectures: [arm64]
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: "placeholder - run deploy.sh" });

  FeedSchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-feed-schedule"
      Description: Pull the news and quote feeds on a schedule.
      ScheduleExpression: !Ref FeedSchedule
      State: ENABLED
      Targets:
        - Id: feed
          Arn: !GetAtt FeedFunction.Arn

  FeedSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FeedFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FeedSchedulerRule.Arn

Outputs:
  SiteUrl:
    Description: Open this.
    Value: !If
      - WithDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  CloudFrontDomain:
    Description: The distribution's own domain, which keeps working alongside any custom one.
    Value: !GetAtt Distribution.DomainName
  SiteBucket:
    Value: !Ref SiteBucket
  FeedFunction:
    Value: !Ref FeedFunction
  DistributionId:
    Value: !Ref Distribution
